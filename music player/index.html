<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="music-player">
        <h1> Music Player</h1>

        <div class="album" id="album">
            <div class="music-icon">
                <img id="album-art" src="images\img2.jpg"  width="100px" class="round-img" alt="Album Art">
            </div>
        </div>

        <h2 id="song-title">Song Title</h2>
        <p id="artist">Artist Name</p>

        <!-- Progress -->
        <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev" title="Previous">⏮️</button>
            <button id="play" class="play-btn" title="Play/Pause">▶️</button>
            <button id="next" title="Next">⏭️</button>
        </div>

        <!-- Volume -->
        <div class="volume">
            🔊
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

        <div id="status"></div>

        <audio id="audio" preload="metadata"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
